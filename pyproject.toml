[project]
name = "tokenpilot"
version = "0.1.0"
description = "Autonomous LLM cost-governance agent with a quality-regression gate"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tokenpilot"]
